<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2f6d88" />
<title>Sin conexión · OC Track</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #12303f;
    background: linear-gradient(125deg, #12364a 0%, #2f6d88 35%, #7fa9be 70%, #a9c6d4 100%) fixed; }
  .card { width: min(380px, 100%); padding: 28px; border-radius: 24px; text-align: center;
    background: rgba(240, 246, 249, .82); border: 1px solid rgba(255,255,255,.6);
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); box-shadow: 0 10px 40px -18px rgba(8,30,45,.55); }
  img { width: 56px; height: 56px; border-radius: 14px; }
  h1 { font-size: 18px; margin: 16px 0 6px; }
  p { margin: 0 0 18px; font-size: 14px; color: #456; line-height: 1.5; }
  button { appearance: none; border: 0; border-radius: 999px; padding: 10px 20px; font: inherit; font-weight: 600;
    background: #10202b; color: #fff; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="" />
    <h1>Sin conexión</h1>
    <p>No hay internet en este momento. Cuando vuelva la señal, tocá reintentar y seguís donde estabas.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
  <script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
